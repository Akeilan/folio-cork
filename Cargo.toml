[workspace]
resolver = "2"
members = ["crates/folio-math", "crates/folio-platform", "crates/folio-kit", "crates/folio-draw-engine", "crates/folio-canvas",
    "crates/folio-page-engine", "crates/folio-page-render", "crates/folio-page-editor", "crates/folio-sheet-engine", "crates/folio-show-engine",
    "folio-page", "folio-sheet", "folio-cork", "folio-draw"]

[workspace.package]
version = "0.3.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3
debug = false
