[package]
name = "folio-kit"
version = "0.3.0"
edition = "2021"

[dependencies]
cosmic-text = "0.19.0"
libm = "0.2.16"
folio-math = { version = "0.3.0", path = "../folio-math" }
folio-platform = { version = "0.3.0", path = "../folio-platform" }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
resvg = { version = "0.49.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
