[package]
name = "folio-reel"
version = "3.0.0"
edition = "2021"
description = "Folio Reel: the video editor, on the portable base"

[[bin]]
name = "folio-reel"
path = "src/main.rs"

[dependencies]
folio-canvas = { version = "0.1.0", path = "../crates/folio-canvas" }
folio-kit = { version = "0.3.0", path = "../crates/folio-kit" }
folio-math = { version = "0.3.0", path = "../crates/folio-math" }
folio-platform = { version = "0.3.0", path = "../crates/folio-platform", features = ["audio"] }
folio-reel-engine = { version = "0.3.0", path = "../crates/folio-reel-engine" }
