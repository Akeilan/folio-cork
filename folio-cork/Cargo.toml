[package]
name = "folio-cork"
version = "0.2.0"
edition = "2021"

[dependencies]
calamine = { version = "0.37.0", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
folio-kit = { version = "0.2.0", path = "../crates/folio-kit" }
miniz_oxide = "0.9.1"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
pdf-writer = "0.15.0"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
